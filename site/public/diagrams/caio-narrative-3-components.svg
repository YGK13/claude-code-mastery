<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="The three components of a CAIO narrative">
<style>.bg{fill:#11151f}.box{fill:#11151f;stroke:#c9a24b;stroke-width:1.5}.boxsoft{fill:#0e121b;stroke:#232838;stroke-width:1}.oxbox{fill:#3a1b22;stroke:#8c2f39;stroke-width:1.5}.txt{fill:#f4f1e9;font-family:Georgia,serif;font-weight:600}.txtsm{fill:#c7cbd8;font-family:Inter,sans-serif;font-size:11px}.txtgold{fill:#e2c079;font-family:Georgia,serif;font-weight:600}.label{fill:#c9a24b;font-family:Inter,sans-serif;font-weight:700;font-size:10px;letter-spacing:0.1em}.arrow{stroke:#c9a24b;stroke-width:1.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a24b"/></marker></defs>
<rect width="720" height="220" class="bg"/>
<text x="20" y="28" class="label">THE CAIO NARRATIVE — THREE COMPONENTS</text>
<rect x="40" y="60" width="180" height="110" rx="10" class="box"/>
<text x="130" y="92" text-anchor="middle" class="txtgold" font-size="14">The convergence claim</text>
<text x="130" y="120" text-anchor="middle" class="txtsm">why now,</text>
<text x="130" y="138" text-anchor="middle" class="txtsm">why you</text>
<rect x="270" y="60" width="180" height="110" rx="10" class="oxbox"/>
<text x="360" y="92" text-anchor="middle" class="txtgold" font-size="14">The proof</text>
<text x="360" y="120" text-anchor="middle" class="txtsm">your portfolio,</text>
<text x="360" y="138" text-anchor="middle" class="txtsm">your stories</text>
<rect x="500" y="60" width="180" height="110" rx="10" class="box"/>
<text x="590" y="92" text-anchor="middle" class="txtgold" font-size="14">The plan</text>
<text x="590" y="120" text-anchor="middle" class="txtsm">the 100 days,</text>
<text x="590" y="138" text-anchor="middle" class="txtsm">how you start</text>
<path d="M220 115 L270 115" class="arrow"/>
<path d="M450 115 L500 115" class="arrow"/>
<text x="20" y="200" class="txtsm">Credentials lose. Narratives — claim, proof, plan — win the seat.</text>
</svg>
