<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="The five CAIO archetypes">
<style>.bg{fill:#11151f}.box{fill:#11151f;stroke:#c9a24b;stroke-width:1.5}.boxsoft{fill:#0e121b;stroke:#232838;stroke-width:1}.oxbox{fill:#3a1b22;stroke:#8c2f39;stroke-width:1.5}.txt{fill:#f4f1e9;font-family:Georgia,serif;font-weight:600}.txtsm{fill:#c7cbd8;font-family:Inter,sans-serif;font-size:11px}.txtgold{fill:#e2c079;font-family:Georgia,serif;font-weight:600}.label{fill:#c9a24b;font-family:Inter,sans-serif;font-weight:700;font-size:10px;letter-spacing:0.1em}.arrow{stroke:#c9a24b;stroke-width:1.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a24b"/></marker></defs>
<rect width="720" height="240" class="bg"/>
<text x="20" y="28" class="label">THE FIVE CAIO ARCHETYPES</text>
<g><rect x="20" y="60" width="130" height="130" rx="10" class="box"/><text x="85" y="92" text-anchor="middle" class="txtgold" font-size="14">Strategist</text><text x="85" y="120" text-anchor="middle" class="txtsm">prioritization,</text><text x="85" y="135" text-anchor="middle" class="txtsm">capital, exec</text><text x="85" y="150" text-anchor="middle" class="txtsm">persuasion</text><text x="85" y="175" text-anchor="middle" class="txtsm">fit: COO, strategy</text></g>
<g><rect x="160" y="60" width="130" height="130" rx="10" class="box"/><text x="225" y="92" text-anchor="middle" class="txtgold" font-size="14">Governor</text><text x="225" y="120" text-anchor="middle" class="txtsm">policy, risk,</text><text x="225" y="135" text-anchor="middle" class="txtsm">the board's</text><text x="225" y="150" text-anchor="middle" class="txtsm">first question</text><text x="225" y="175" text-anchor="middle" class="txtsm">fit: legal, HR, risk</text></g>
<g><rect x="300" y="60" width="130" height="130" rx="10" class="oxbox"/><text x="365" y="92" text-anchor="middle" class="txtgold" font-size="14">Transformer</text><text x="365" y="120" text-anchor="middle" class="txtsm">change,</text><text x="365" y="135" text-anchor="middle" class="txtsm">adoption,</text><text x="365" y="150" text-anchor="middle" class="txtsm">the human side</text><text x="365" y="175" text-anchor="middle" class="txtsm">fit: CHRO, COO</text></g>
<g><rect x="440" y="60" width="130" height="130" rx="10" class="box"/><text x="505" y="92" text-anchor="middle" class="txtgold" font-size="14">Platform</text><text x="505" y="120" text-anchor="middle" class="txtsm">infra, data,</text><text x="505" y="135" text-anchor="middle" class="txtsm">build vs buy,</text><text x="505" y="150" text-anchor="middle" class="txtsm">engineering org</text><text x="505" y="175" text-anchor="middle" class="txtsm">fit: tech leaders</text></g>
<g><rect x="580" y="60" width="120" height="130" rx="10" class="box"/><text x="640" y="92" text-anchor="middle" class="txtgold" font-size="14">Commerce</text><text x="640" y="120" text-anchor="middle" class="txtsm">AI products,</text><text x="640" y="135" text-anchor="middle" class="txtsm">revenue,</text><text x="640" y="150" text-anchor="middle" class="txtsm">new lines</text><text x="640" y="175" text-anchor="middle" class="txtsm">fit: GTM, product</text></g>
<text x="20" y="222" class="txtsm">Most strong CAIOs pair two archetypes. Pick your lead, name your adjacent strength, target your gap.</text>
</svg>
