<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="The LLM lifecycle: pre-training, fine-tuning, RLHF, deployment">
<style>.bg{fill:#11151f}.box{fill:#11151f;stroke:#c9a24b;stroke-width:1.5}.boxsoft{fill:#0e121b;stroke:#232838;stroke-width:1}.oxbox{fill:#3a1b22;stroke:#8c2f39;stroke-width:1.5}.txt{fill:#f4f1e9;font-family:Georgia,serif;font-weight:600}.txtsm{fill:#c7cbd8;font-family:Inter,sans-serif;font-size:11px}.txtgold{fill:#e2c079;font-family:Georgia,serif;font-weight:600}.label{fill:#c9a24b;font-family:Inter,sans-serif;font-weight:700;font-size:10px;letter-spacing:0.1em}.arrow{stroke:#c9a24b;stroke-width:1.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a24b"/></marker></defs>
<rect width="720" height="200" class="bg"/>
<text x="20" y="28" class="label">THE LLM LIFECYCLE</text>
<rect x="20" y="55" width="150" height="80" rx="10" class="box"/>
<text x="95" y="92" text-anchor="middle" class="txt" font-size="15">Pre-training</text>
<text x="95" y="112" text-anchor="middle" class="txtsm">months · ~$100M+</text>
<rect x="195" y="65" width="130" height="60" rx="10" class="box"/>
<text x="260" y="92" text-anchor="middle" class="txt" font-size="14">Fine-tuning (SFT)</text>
<text x="260" y="110" text-anchor="middle" class="txtsm">weeks · $10K–$1M</text>
<rect x="350" y="73" width="115" height="44" rx="10" class="box"/>
<text x="407" y="92" text-anchor="middle" class="txt" font-size="13">RLHF / RLAIF</text>
<text x="407" y="108" text-anchor="middle" class="txtsm">days · alignment</text>
<rect x="490" y="78" width="105" height="34" rx="10" class="oxbox"/>
<text x="542" y="98" text-anchor="middle" class="txtgold" font-size="13">Deployment</text>
<path d="M170 95 L195 95" class="arrow"/>
<path d="M325 95 L350 95" class="arrow"/>
<path d="M465 95 L490 95" class="arrow"/>
<text x="20" y="170" class="txtsm">Capability is set in pre-training. Behavior is shaped in fine-tuning + RLHF. The CAIO chooses where to enter.</text>
<line x1="20" y1="180" x2="60" y2="180" stroke="#c9a24b" stroke-width="2"/>
</svg>
