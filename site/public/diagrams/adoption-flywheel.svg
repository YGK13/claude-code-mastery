<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="The adoption flywheel: map the 25%, build proof cases, scale literacy">
<style>.bg{fill:#11151f}.box{fill:#11151f;stroke:#c9a24b;stroke-width:1.5}.boxsoft{fill:#0e121b;stroke:#232838;stroke-width:1}.oxbox{fill:#3a1b22;stroke:#8c2f39;stroke-width:1.5}.txt{fill:#f4f1e9;font-family:Georgia,serif;font-weight:600}.txtsm{fill:#c7cbd8;font-family:Inter,sans-serif;font-size:11px}.txtgold{fill:#e2c079;font-family:Georgia,serif;font-weight:600}.label{fill:#c9a24b;font-family:Inter,sans-serif;font-weight:700;font-size:10px;letter-spacing:0.1em}.arrow{stroke:#c9a24b;stroke-width:1.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a24b"/></marker></defs>
<rect width="480" height="360" class="bg"/>
<text x="20" y="28" class="label">THE ADOPTION FLYWHEEL</text>
<circle cx="240" cy="195" r="42" class="oxbox"/>
<text x="240" y="195" text-anchor="middle" class="txtgold" font-size="13">Proof case</text>
<text x="240" y="212" text-anchor="middle" class="txtsm">engine</text>
<rect x="180" y="65" width="120" height="48" rx="10" class="box"/>
<text x="240" y="93" text-anchor="middle" class="txt" font-size="12">Map the 25%</text>
<rect x="340" y="170" width="120" height="48" rx="10" class="box"/>
<text x="400" y="198" text-anchor="middle" class="txt" font-size="12">Demonstrate</text>
<rect x="180" y="275" width="120" height="48" rx="10" class="box"/>
<text x="240" y="303" text-anchor="middle" class="txt" font-size="12">Scale literacy</text>
<rect x="20" y="170" width="120" height="48" rx="10" class="box"/>
<text x="80" y="198" text-anchor="middle" class="txt" font-size="12">Recruit peers</text>
<path d="M240 113 C 290 130, 330 150, 348 170" class="arrow"/>
<path d="M400 218 C 380 250, 320 280, 290 295" class="arrow"/>
