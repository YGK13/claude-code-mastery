<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="The five buckets of AI value">
<style>.bg{fill:#11151f}.box{fill:#11151f;stroke:#c9a24b;stroke-width:1.5}.boxsoft{fill:#0e121b;stroke:#232838;stroke-width:1}.oxbox{fill:#3a1b22;stroke:#8c2f39;stroke-width:1.5}.txt{fill:#f4f1e9;font-family:Georgia,serif;font-weight:600}.txtsm{fill:#c7cbd8;font-family:Inter,sans-serif;font-size:11px}.txtgold{fill:#e2c079;font-family:Georgia,serif;font-weight:600}.label{fill:#c9a24b;font-family:Inter,sans-serif;font-weight:700;font-size:10px;letter-spacing:0.1em}.arrow{stroke:#c9a24b;stroke-width:1.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a24b"/></marker></defs>
<rect width="720" height="260" class="bg"/>
<text x="20" y="28" class="label">THE FIVE BUCKETS OF AI VALUE</text>
<g><rect x="20" y="60" width="130" height="160" rx="10" class="box"/><text x="85" y="92" text-anchor="middle" class="txtgold" font-size="13">Revenue lift</text><text x="85" y="115" text-anchor="middle" class="txtsm">new products,</text><text x="85" y="133" text-anchor="middle" class="txtsm">conversion,</text><text x="85" y="151" text-anchor="middle" class="txtsm">cross-sell</text></g>
<g><rect x="160" y="60" width="130" height="160" rx="10" class="box"/><text x="225" y="92" text-anchor="middle" class="txtgold" font-size="13">Cost takeout</text><text x="225" y="115" text-anchor="middle" class="txtsm">automation,</text><text x="225" y="133" text-anchor="middle" class="txtsm">cycle compression,</text><text x="225" y="151" text-anchor="middle" class="txtsm">vendor consolidation</text></g>
<g><rect x="300" y="60" width="130" height="160" rx="10" class="oxbox"/><text x="365" y="92" text-anchor="middle" class="txtgold" font-size="13">Risk reduction</text><text x="365" y="115" text-anchor="middle" class="txtsm">fraud, compliance,</text><text x="365" y="133" text-anchor="middle" class="txtsm">incident cost,</text><text x="365" y="151" text-anchor="middle" class="txtsm">avoided losses</text></g>
<g><rect x="440" y="60" width="130" height="160" rx="10" class="box"/><text x="505" y="92" text-anchor="middle" class="txtgold" font-size="13">Speed</text><text x="505" y="115" text-anchor="middle" class="txtsm">time-to-decision,</text><text x="505" y="133" text-anchor="middle" class="txtsm">time-to-market,</text><text x="505" y="151" text-anchor="middle" class="txtsm">cycle time</text></g>
<g><rect x="580" y="60" width="120" height="160" rx="10" class="box"/><text x="640" y="92" text-anchor="middle" class="txtgold" font-size="13">Optionality</text><text x="640" y="115" text-anchor="middle" class="txtsm">capabilities</text><text x="640" y="133" text-anchor="middle" class="txtsm">you didn't</text><text x="640" y="151" text-anchor="middle" class="txtsm">have before</text></g>
<text x="20" y="245" class="txtsm">Every AI bet must land in at least one bucket. Most CFOs reject pitches that try to claim all five.</text>
</svg>
