<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Build vs buy vs fine-tune decision tree">
<style>.bg{fill:#11151f}.box{fill:#11151f;stroke:#c9a24b;stroke-width:1.5}.boxsoft{fill:#0e121b;stroke:#232838;stroke-width:1}.oxbox{fill:#3a1b22;stroke:#8c2f39;stroke-width:1.5}.txt{fill:#f4f1e9;font-family:Georgia,serif;font-weight:600}.txtsm{fill:#c7cbd8;font-family:Inter,sans-serif;font-size:11px}.txtgold{fill:#e2c079;font-family:Georgia,serif;font-weight:600}.label{fill:#c9a24b;font-family:Inter,sans-serif;font-weight:700;font-size:10px;letter-spacing:0.1em}.arrow{stroke:#c9a24b;stroke-width:1.5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9a24b"/></marker></defs>
<rect width="720" height="360" class="bg"/>
<text x="20" y="28" class="label">BUILD vs BUY vs FINE-TUNE</text>
<rect x="260" y="60" width="200" height="50" rx="10" class="oxbox"/>
<text x="360" y="90" text-anchor="middle" class="txtgold" font-size="13">Need an AI capability</text>
<rect x="80" y="160" width="180" height="60" rx="10" class="box"/>
<text x="170" y="185" text-anchor="middle" class="txt" font-size="13">Differentiating?</text>
<text x="170" y="205" text-anchor="middle" class="txtsm">unique data + IP value</text>
<rect x="460" y="160" width="180" height="60" rx="10" class="box"/>
<text x="550" y="185" text-anchor="middle" class="txt" font-size="13">Commodity?</text>
<text x="550" y="205" text-anchor="middle" class="txtsm">solved problem</text>
<rect x="40" y="270" width="160" height="60" rx="10" class="box"/>
<text x="120" y="295" text-anchor="middle" class="txtgold" font-size="13">FINE-TUNE</text>
<text x="120" y="315" text-anchor="middle" class="txtsm">your data, vendor base</text>
<rect x="220" y="270" width="160" height="60" rx="10" class="box"/>
<text x="300" y="295" text-anchor="middle" class="txtgold" font-size="13">BUILD</text>
<text x="300" y="315" text-anchor="middle" class="txtsm">real moat, real budget</text>
<rect x="430" y="270" width="240" height="60" rx="10" class="box"/>
<text x="550" y="295" text-anchor="middle" class="txtgold" font-size="13">BUY</text>
<text x="550" y="315" text-anchor="middle" class="txtsm">default for ~70% of asks</text>
<line x1="360" y1="110" x2="170" y2="160" stroke="#232838"/>
<line x1="360" y1="110" x2="550" y2="160" stroke="#232838"/>
<line x1="170" y1="220" x2="120" y2="270" stroke="#232838"/>
<line x1="170" y1="220" x2="300" y2="270" stroke="#232838"/>
<line x1="550" y1="220" x2="550" y2="270" stroke="#232838"/>
</svg>
